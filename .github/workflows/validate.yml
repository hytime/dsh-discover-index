name: Validate

# Pull-request and main-branch gate. Proves that the pipeline still compiles,
# that the tests pass, and that the index it produces satisfies format 1.
#
# Deliberately has no Pages permission and no deploy step: nothing in this
# workflow can change what is published. Publishing is build.yml's job.

on:
  pull_request:
  push:
    branches:
      - main

# Per-branch groups: a superseded PR push cancels its own older run, while a
# main-branch run and a PR run never cancel each other.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup must run BEFORE actions/setup-node: setup-node's
      # `cache: pnpm` shells out to the pnpm binary to locate the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Compile TypeScript
        run: pnpm run build

      # Runs the real pipeline against the live upstream catalog. Retried a
      # couple of times so a transient third-party outage does not read as a
      # broken pull request; a persistent failure still fails the gate.
      - name: Build the index from the live upstream catalog
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node dist/cli.js build; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          echo "index build failed after 3 attempts" >&2
          exit 1

      - name: Validate dist/index.json with the real validator
        run: |
          node -e "import('@deepseek-ai/dsh-plugin-market-index').then(m=>{const fs=require('fs');const doc=JSON.parse(fs.readFileSync('dist/index.json','utf8'));const v=m.parseMarketIndex(doc,'https://hytime.github.io/dsh-discover-index/index.json');console.log('valid, plugins='+v.plugins.length)})"

      # Additional profile outputs (configured in config/config.yml) are
      # validated generically, so renaming or adding a profile needs no change
      # to this workflow.
      - name: Validate additional profile outputs
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in dist/*.json; do
            if [ "$file" = "dist/index.json" ]; then
              continue
            fi
            node -e "import('@deepseek-ai/dsh-plugin-market-index').then(m=>{const fs=require('fs');const f=process.argv[1];const doc=JSON.parse(fs.readFileSync(f,'utf8'));const v=m.parseMarketIndex(doc,'https://hytime.github.io/dsh-discover-index/'+f.split('/').pop());console.log('valid '+f+', plugins='+v.plugins.length)})" "$file"
          done

      # Mirrors build.yml's floor check, so a pull request that would trip the
      # publish guard fails here instead of after merge.
      - name: Guard against a near-empty index
        run: |
          node -e "
            const fs = require('fs');
            const doc = JSON.parse(fs.readFileSync('dist/index.json', 'utf8'));
            const count = Array.isArray(doc.plugins) ? doc.plugins.length : 0;
            const floor = 2000;
            if (count < floor) {
              console.error('FAIL: dist/index.json holds ' + count + ' plugins, below the floor of ' + floor);
              process.exit(1);
            }
            console.log('Plugin count ok: ' + count + ' >= ' + floor);
          "
